<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formula One application</title>
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="/assets/styles/pages/index.css">
    <link rel="stylesheet" type="text/css" href="/assets/styles/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar__logo">
            <a href="/index">
                <img src="/assets/images/logo.png" alt="logo" class="navbar__logo">
            </a>
        </div>

        <input id="menu-toggler" type="checkbox" class="menu-toggler">
        <label for="menu-toggler" class="navbar__hamburger">
            <span></span>
        </label>

        <ul class="navbar__menu">
            <li class="navbar__menu-link">
                <a href="/index">Home</a>
            </li>
            <li class="navbar__menu-link">
                <button>Standings</button>
                <ul class="navbar__submenu">
                    <li class="navbar__submenu-link">
                        <a href="/standings/drivers">Drivers</a>
                    </li>
                    <li class="navbar__submenu-link">
                        <a href="/standings/constructors">Constructors</a>
                    </li>
                </ul>
            </li>
            <li class="navbar__menu-link">
                <a href="/schedule">Schedule</a>
            </li>
            <li class="navbar__menu-link">
                <a href="/tracks">Tracks</a>
            </li>
        </ul>

        <ul class="navbar__menu-mobile">
            <li class="navbar__menu-link-mobile">
                <a href="/index">Home</a>
            </li>
            <li class="navbar__submenu-link-mobile">
                <input type="checkbox" id="submenu__toggle" class="submenu__toggle">
                <label for="submenu__toggle" class="submenu__label">Standings</label>
                <ul class="submenu__list">
                    <li class="navbar__menu-link-mobile">
                        <a href="/standings/drivers">Drivers</a>
                    </li>
                    <li class="navbar__menu-link-mobile">
                        <a href="/standings/constructors">Constructors</a>
                    </li>
                </ul>
            </li>
            <li class="navbar__menu-link-mobile">
                <a href="/schedule">Schedule</a>
            </li>
            <li class="navbar__menu-link-mobile">
                <a href="/tracks">Tracks</a>
            </li>
        </ul>
    </nav>

    <main>
        <section class="background-container">
            <img class="background-img" src="/assets/images/background.jpg" alt="home-page-background">
        </section>

        <section class="timer-container">
            <div class="next-race-title" id="next-race-title">
                <h2>Next race: </h2>
            </div>
            <div class="next-race-timer" id="next-race-timer">
                <div class="next-race-timer-part">
                    <h2 id="next-race-timer-days"></h2>
                    <p>Days</p>
                </div>
                <div class="next-race-timer-part">
                    <h2 id="next-race-timer-hours"></h2>
                    <p>Hours</p>
                </div>
                <div class="next-race-timer-part">
                    <h2 id="next-race-timer-minutes"></h2>
                    <p>Minutes</p>
                </div>
                <div class="next-race-timer-part">
                    <h2 id="next-race-timer-seconds"></h2>
                    <p>Seconds</p>
                </div>
            </div>
        </section>

        <section class="container">
            <div class="last-race-container">
                <div class="last-race-title" id="last-race-title"></div>
                <div id="last-race-podium" class="last-race-podium"></div>
            </div>


        </section>
    </main>

    <footer class="footer">
        <p>2025 &copy; All rights reserved.</p>
    </footer>
    <script type="module" src="../../assets/js/index.js"></script>
</body>
</html>
